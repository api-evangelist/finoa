name: Finoa
description: >-
  Finoa is a Berlin-based, BaFin-regulated digital asset infrastructure provider
  serving institutional investors, asset managers, family offices, venture capital
  funds, and regulated crypto service providers. Its platform combines qualified
  custody, in-custody staking, and prime brokerage across 170+ digital assets and
  12 Layer-1 networks, with security and governance controls built for institutional
  and regulatory requirements. Finoa exposes a gated institutional API surface
  (api.finoa.io) and a client platform (login.finoa.io / app.finoa.io) rather than a
  public self-serve developer program. Surfaced as a portfolio company of
  balderton-capital and added to the API Evangelist network for enrichment.
